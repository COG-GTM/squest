name: On pull request

on: [pull_request]  # set to this value when pushing in prod
#on: [push] # set this one for dev the ci/cd

# one run per PR: two pushes in quick succession must not both reach the spawn step
concurrency:
  group: on-pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DJANGO_SETTINGS_MODULE: Squest.settings
  PROJECT_COVERAGE_THRESHOLD: '90'
  PATCH_COVERAGE_THRESHOLD: '85'
  COVERAGE_BACKFILL_LABEL: devin-coverage-backfill

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write  # the coverage backfill label is created through the labels API
    strategy:
      matrix:
        python-version: ['3.12']
        poetry-version: ['1.8.0']

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # patch coverage needs the merge base

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y libuv1-dev
          sudo apt install -y default-libmysqlclient-dev gcc npm libldap2-dev libsasl2-dev graphviz libsqlite3-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        uses: abatilo/actions-poetry@v2.0.0
        with:
          poetry-version: ${{ matrix.poetry-version }}

      - name: Install dependencies
        run: |
          poetry install

      - name: Run Tests
        run: |
          poetry run coverage run --source='.' manage.py test

      - name: Check static references
        run: |
          poetry run python scripts/check_static_refs.py

      - name: Run coverage report
        run: |
          poetry run coverage report

      - name: Generate HTML report
        run: |
          poetry run coverage html

      - name: Generate lcov report
        run: |
          poetry run coverage lcov

      - name: Generate json report
        run: |
          poetry run coverage json -o coverage.json

      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov

      - name: Coveralls
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coverage.lcov

      - name: Check whether the PR only touches tests
        id: diff-scope
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          # a failing git diff aborts the step, so an empty list really does mean "nothing changed"
          changed=$(git diff --merge-base --name-only "$BASE_REF" HEAD)
          if [ -z "$changed" ]; then
            echo "No files changed against $BASE_REF - skipping the patch coverage gate"
            echo "tests_only=true" >> "$GITHUB_OUTPUT"
          else
            # grep exits 1 for "every path is under tests/" and 2 for its own failure, which errexit does
            # not catch inside a condition: a broken check must not silently skip the gate
            set +e
            echo "$changed" | grep -qvE '^tests/'
            rc=$?
            set -e
            if [ "$rc" -gt 1 ]; then
              echo "grep failed with status $rc while classifying the changed files" >&2
              exit "$rc"
            fi
            echo "tests_only=$([ "$rc" -eq 0 ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          fi

      - name: Check patch coverage
        id: patch-coverage
        if: steps.diff-scope.outputs.tests_only == 'false'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          # exit 1 means "below threshold" and drives the gate below; any other non-zero status is a
          # broken check and fails here, so a crash is never reported as a coverage regression.
          # the helper is stdlib-only and runs outside poetry, so a broken venv cannot exit 1 in its place
          set +e
          python scripts/patch_coverage.py \
            --base-ref "$BASE_REF" \
            --fail-under "$PATCH_COVERAGE_THRESHOLD" \
            --report patch-coverage.md
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Publish the patch coverage report
        if: always() && hashFiles('patch-coverage.md') != ''
        continue-on-error: true  # best effort: the backfill session must not depend on the summary
        run: |
          cat patch-coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Check whether this PR already had a backfill session
        id: backfill-state
        # the labels in the event payload are a snapshot taken before this run's own labelling step,
        # so a re-run would replay a label-free payload; read the current labels instead.
        # fork PRs are excluded here: they get no secrets and their head branch is not in this repository
        if: >-
          steps.patch-coverage.outputs.status == '1' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          if echo "$labels" | grep -qxF "$COVERAGE_BACKFILL_LABEL"; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Spawn a Devin session to backfill the missing tests
        id: spawn-session
        # only once per PR: the label added afterwards stops the session's own push from spawning another
        if: steps.backfill-state.outputs.already == 'false'
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ vars.DEVIN_ORG_ID }}
          DEVIN_CREATE_AS_USER_ID: ${{ vars.DEVIN_CREATE_AS_USER_ID }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python scripts/spawn_coverage_session.py

      - name: Label the PR as backfilled
        # keyed on a session actually existing, not on the step succeeding: the script reports
        # session_created as soon as the API accepts the request, so a session that is created but not
        # reported still gets the label (it is the only thing stopping the next push from spawning a
        # second one), while a call that never created anything leaves the PR eligible to retry
        if: always() && steps.spawn-session.outputs.session_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create "$COVERAGE_BACKFILL_LABEL" --description "A Devin session was spawned to backfill coverage" || true
          gh pr edit "$PR_NUMBER" --add-label "$COVERAGE_BACKFILL_LABEL"

      - name: Comment the spawned session on the PR
        # always(): a failure to label must not swallow the session link
        if: always() && steps.spawn-session.outputs.session_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SESSION_URL: ${{ steps.spawn-session.outputs.session_url }}
        run: |
          {
            echo "Patch coverage is below $PATCH_COVERAGE_THRESHOLD%, so a Devin session was started to backfill tests for the symbols this PR left uncovered: $SESSION_URL"
            echo
            echo '```'
            cat patch-coverage.md
            echo '```'
          } | gh pr comment "$PR_NUMBER" --body-file -

      - name: Enforce coverage gates
        if: always()  # a failure to spawn or comment must not hide a coverage regression
        run: |
          poetry run coverage report --fail-under=${{ env.PROJECT_COVERAGE_THRESHOLD }}
          if [ "${{ steps.patch-coverage.outputs.status }}" = "1" ]; then
            echo "Patch coverage below ${{ env.PATCH_COVERAGE_THRESHOLD }}% - see the 'Check patch coverage' step"
            exit 1
          fi
