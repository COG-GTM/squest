name: On pull request

on: [pull_request]  # set to this value when pushing in prod
#on: [push] # set this one for dev the ci/cd

env:
  DJANGO_SETTINGS_MODULE: Squest.settings
  PROJECT_COVERAGE_THRESHOLD: '90'
  PATCH_COVERAGE_THRESHOLD: '85'
  COVERAGE_BACKFILL_LABEL: devin-coverage-backfill

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        python-version: ['3.12']
        poetry-version: ['1.8.0']

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # patch coverage needs the merge base

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y libuv1-dev
          sudo apt install -y default-libmysqlclient-dev gcc npm libldap2-dev libsasl2-dev graphviz libsqlite3-dev

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        uses: abatilo/actions-poetry@v2.0.0
        with:
          poetry-version: ${{ matrix.poetry-version }}

      - name: Install dependencies
        run: |
          poetry install

      - name: Run Tests
        run: |
          poetry run coverage run --source='.' manage.py test

      - name: Run coverage report
        run: |
          poetry run coverage report

      - name: Generate HTML report
        run: |
          poetry run coverage html

      - name: Generate lcov report
        run: |
          poetry run coverage lcov

      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov

      - name: Coveralls
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coverage.lcov

      - name: Generate json report
        run: |
          poetry run coverage json -o coverage.json

      - name: Check whether the PR only touches tests
        id: diff-scope
        run: |
          changed=$(git diff --merge-base --name-only origin/${{ github.base_ref }})
          if [ -z "$changed" ]; then
            echo "No changed files resolved against origin/${{ github.base_ref }} - the merge base is wrong"
            exit 1
          fi
          if echo "$changed" | grep -qvE '^tests/'; then
            echo "tests_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "tests_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check patch coverage
        id: patch-coverage
        if: steps.diff-scope.outputs.tests_only == 'false'
        continue-on-error: true  # the gate is enforced at the end, after a backfill session is spawned
        run: |
          poetry run python scripts/patch_coverage.py \
            --base-ref origin/${{ github.base_ref }} \
            --fail-under ${{ env.PATCH_COVERAGE_THRESHOLD }} \
            --report patch-coverage.md

      - name: Publish the patch coverage report
        if: always() && hashFiles('patch-coverage.md') != ''
        run: |
          cat patch-coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Spawn a Devin session to backfill the missing tests
        id: spawn-session
        # only once per PR: the label added below stops the session's own push from spawning another.
        # fork PRs are excluded: they get no secrets and their head branch is not in this repository
        if: >-
          steps.patch-coverage.outcome == 'failure' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          !contains(github.event.pull_request.labels.*.name, env.COVERAGE_BACKFILL_LABEL)
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ vars.DEVIN_ORG_ID }}
          DEVIN_CREATE_AS_USER_ID: ${{ vars.DEVIN_CREATE_AS_USER_ID }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python scripts/spawn_coverage_session.py

      - name: Comment the spawned session on the PR
        if: steps.spawn-session.outcome == 'success' && steps.spawn-session.outputs.session_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Patch coverage is below ${{ env.PATCH_COVERAGE_THRESHOLD }}%, so a Devin session was started to backfill tests for the symbols this PR left uncovered: ${{ steps.spawn-session.outputs.session_url }}"
            echo
            echo '```'
            cat patch-coverage.md
            echo '```'
          } | gh pr comment ${{ github.event.pull_request.number }} --body-file -
          # the label is what stops a second session from being spawned, so create it if it is missing
          gh label create "${{ env.COVERAGE_BACKFILL_LABEL }}" --description "A Devin session was spawned to backfill coverage" || true
          gh pr edit ${{ github.event.pull_request.number }} --add-label "${{ env.COVERAGE_BACKFILL_LABEL }}"

      - name: Enforce coverage gates
        if: always()  # a failure to spawn or comment must not hide a coverage regression
        run: |
          poetry run coverage report --fail-under=${{ env.PROJECT_COVERAGE_THRESHOLD }}
          if [ "${{ steps.patch-coverage.outcome }}" = "failure" ]; then
            echo "Patch coverage below ${{ env.PATCH_COVERAGE_THRESHOLD }}% - see the 'Check patch coverage' step"
            exit 1
          fi
